name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/remote3_display/manifest.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"

      - name: Restore observer signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.OBSERVER_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/observer-release.jks"

      - name: Build TiviMate Observer
        working-directory: tivimate-observer
        env:
          OBSERVER_KEYSTORE_PATH: ${{ runner.temp }}/observer-release.jks
          OBSERVER_KEYSTORE_PASSWORD: ${{ secrets.OBSERVER_KEYSTORE_PASSWORD }}
          OBSERVER_KEY_ALIAS: ${{ secrets.OBSERVER_KEY_ALIAS }}
          OBSERVER_KEY_PASSWORD: ${{ secrets.OBSERVER_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Prepare observer APK
        run: cp tivimate-observer/app/build/outputs/apk/release/app-release.apk TiviMateObserver-1.0.0.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Remote 3 Media Display v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: TiviMateObserver-1.0.0.apk
