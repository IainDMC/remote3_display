name: Build TiviMate Observer

on:
  push:
    paths:
      - "tivimate-observer/**"
      - ".github/workflows/observer.yml"
  pull_request:
    paths:
      - "tivimate-observer/**"
      - ".github/workflows/observer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"

      - name: Build observer APK
        working-directory: tivimate-observer
        run: gradle :app:assembleDebug
